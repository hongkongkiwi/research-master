# Vendored from citationberg 0.7.0 (crates.io), upstream commit
# 25c66d5f79d919fb8446ef33075a70977066e82c at https://github.com/typst/citationberg.
# Local change: upgrade quick-xml to 0.41 for RUSTSEC-2026-0194 and RUSTSEC-2026-0195.
# Source, test fixtures, README, rustfmt config, and license notices are unchanged.
[package]
name = "citationberg"
version = "0.7.0"
authors = ["Martin Haug <mhaug@live.de>"]
license = "MIT OR Apache-2.0"
description = "A parser for CSL files"
repository = "https://github.com/typst/citationberg"
readme = "README.md"
categories = ["parser-implementations", "text-processing"]
keywords = ["csl", "bibliography", "citation"]
edition = "2024"
exclude = ["assets/*"]

[features]
default = []
json = ["unscanny"] # adds support for CSL-json parsing

[dependencies]
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
unscanny = { version = "0.1.0", optional = true }

[dev-dependencies]
ciborium = "0.2.2"
serde_json = "1.0"
serde_path_to_error = "0.1"
